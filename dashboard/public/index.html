<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SOC Manager's Toolkit — Dashboard</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div>
        <div class="brand__title">SOC Manager's Toolkit</div>
        <div class="brand__subtitle">Operational posture dashboard (local-only)</div>
      </div>
    </div>

    <div class="topbar__right">
      <div class="pill" id="connPill">connecting…</div>
      <button class="btn" id="refreshBtn">Refresh</button>
    </div>
  </header>

  <main class="layout">
    <section class="left">
      <div class="panel">
        <div class="panel__title">Agents</div>
        <div class="panel__body" id="agentsList"></div>
      </div>

      <div class="panel">
        <div class="panel__title">Run Browser</div>
        <div class="panel__body">
          <div class="muted">Select an agent to browse runs.</div>
          <div id="runsList" class="runs"></div>
        </div>
      </div>
    </section>

    <section class="right">
      <div class="panel" id="socDailyPanel">
        <div class="panel__title">Daily SOC / CISO Overview</div>
        <div class="panel__body">
          <div id="socDailyMeta" class="detail__meta"></div>
          <div id="socDailyContent" class="preview" style="max-height:520px; overflow:auto;"></div>
        </div>
      </div>

      <div class="grid" id="tiles"></div>

      <div class="panel" id="detailPanel" style="display:none">
        <div class="panel__title" id="detailTitle">Details</div>
        <div class="panel__body">
          <div class="detail__meta" id="detailMeta"></div>
          <div class="detail__split">
            <div>
              <div class="subhead">Artifacts</div>
              <div id="detailFiles" class="files"></div>
            </div>
            <div>
              <div class="subhead">Preview</div>
              <div id="detailPreview" class="preview"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="/app.js?v=20260206-1"></script>
</body>
</html>
